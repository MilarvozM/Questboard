<!doctype html>
<html lang="en" data-theme="terminal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="/base.css">
</head>
<body class="loading">

<header class="top">
  <div class="brand"><div class="brand-mark"></div><b data-t="brand"></b></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="search" id="search"></div>
  <button class="player" data-player>
    <div class="xp"><div class="row"><span>XP</span><span id="xp-n"></span></div><div class="bar"><i id="xp-bar"></i></div></div>
    <div class="lvhex hexclip"><div><small>LV</small><strong id="lv"></strong></div></div>
  </button>
  <button class="tb" id="skin" data-skin></button>
  <button class="tb" id="gear" data-settings></button>
</header>

<section class="focus" id="focus"></section>

<div class="shell">
  <aside class="rail" id="rail"></aside>
  <div class="stage">
    <main class="view log" id="v-log"><section class="list" id="list"></section><section class="detail frame" id="detail"></section></main>
    <main class="view cal" id="v-cal"></main>
    <main class="view journal" id="v-journal"><section class="entries" id="entries"></section><article class="page frame" id="page"></article></main>
  </div>
</div>

<div class="pop frame" id="pop"></div>
<button class="fab hexclip" id="fab" data-fab></button>
<section class="capbox frame" id="capbox"></section>
<div class="pick frame" id="pick"></div>
<div class="drawer-back" id="drawer-back" data-fclose></div>
<aside class="drawer" id="drawer"></aside>
<section class="results" id="done"></section>
<div class="banner" id="banner"><div class="burst"><i></i><i></i><i></i></div><span class="k"></span><div class="t"></div><div class="q"></div><button class="undo" data-undo></button></div>
<section class="settings frame" id="settings"></section>
<section class="mdview frame" id="mdview"></section>
<section class="pview frame" id="pview"></section>
<div class="lost" id="lost"></div>

<script type="module" src="/main.js"></script>
</body>
</html>
